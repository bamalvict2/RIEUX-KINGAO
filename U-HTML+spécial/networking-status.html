<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KING-AO Networking Status</title>
<style>
body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px; }
.card { background:#1e293b; padding:20px; border-radius:12px; }
h1 { color:#38bdf8; }
pre { background:#0b1120; padding:12px; border-radius:8px; }
</style>
</head>
<body>
<div class="card">
<h1>Diagnostic Réseau KING‑AO</h1>
<pre id="output">Chargement...</pre>
</div>

<script>
fetch("last-check.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("output").textContent =
      JSON.stringify(data, null, 2);
  });
</script>
</body>
</html>

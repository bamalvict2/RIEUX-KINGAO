networks:
  kingao-net:

volumes:
  loki-data:

services:

  # ============================
  #  PROMETHEUS — METRICS
  # ============================
  prometheus:
    image: prom/prometheus:latest
    container_name: kingao-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - kingao-net

  # ============================
  #  GRAFANA — DASHBOARDS
  # ============================
  grafana:
    image: grafana/grafana:latest
    container_name: kingao-grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - kingao-net

  # ============================
  #  CADVISOR — CONTAINER METRICS
  # ============================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: kingao-cadvisor
    restart: always
    ports:
      - "8080:8080"
    networks:
      - kingao-net

  # ============================
  #  PROMTAIL — LOG COLLECTOR
  # ============================
  promtail:
    image: grafana/promtail:latest
    container_name: kingao-promtail
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
    networks:
      - kingao-net

  # ============================
  #  LOKI — LOG STORAGE
  # ============================
  loki:
    image: grafana/loki:2.9.3
    container_name: kingao-loki
    restart: always
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - loki-data:/loki
      - /opt/KING-AO/monitoring/loki-config.yml:/etc/loki/config.yaml
    ports:
      - "3100:3100"
    networks:
      - kingao-net


version: "3.9"

services:

  solaizeapi:
    image: solaizeapi:latest
    container_name: solaizeapi
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    networks:
      - eparvier_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  solaizecockpit:
    image: solaizecockpit:latest
    container_name: solaizecockpit
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    networks:
      - eparvier_net
    depends_on:
      solaizeapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: mongo_eparvier
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - eparvier_net

networks:
  eparvier_net:

volumes:
  mongo_data:


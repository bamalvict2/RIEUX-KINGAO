version: "3.9"

services:

  kingdomaine-cockpit:
    container_name: kingdomaine-cockpit

    build:
      context: ..
      dockerfile: docker/dockerfile.Cockpit

    ports:
      - "8082:80"

    restart: unless-stopped

    networks:
      - king-ao-net

networks:
  king-ao-net:
    external: true
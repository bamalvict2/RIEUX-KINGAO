version: '3.8'

services:

  portal:
    image: nginx:latest
    container_name: portal
    restart: unless-stopped

    # PORTAL sert ton site HTML
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "5000:80"

    networks:
      - kingao-net   # 🔗 Connexion au réseau global KING-AO

networks:
  kingao-net:
    external: true   # 🔥 Réseau global KING-AO (NE PAS mettre driver: bridge)
